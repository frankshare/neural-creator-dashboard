name: Deploy to GitHub Pages

# 每次推送到 main 自动构建并发布；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # 关键一步：强制切回虚构示例数据。
      # 个人笔记由 `npm run import -- --vault <文件夹>` 在本地写入
      # src/data/my-data.js，该文件已被 .gitignore 排除，CI 里不存在；
      # 这里再显式 reset 一次，确保任何情况下公开产物都不含私人内容。
      - name: Force fictional sample data (never publish personal notes)
        run: node scripts/import-notes.mjs --reset

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
